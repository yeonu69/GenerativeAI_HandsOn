<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 인생 영화: 코코</title>
<style>
body{margin:0;font-family:"Noto Sans KR",sans-serif;background:#FFF9F0;color:#2a2a2a;line-height:1.7}
.top{background:linear-gradient(135deg,#E8865A,#F2B35B);color:#fff;padding:40px 24px;text-align:center}
.top h1{margin:0;font-size:40px}.top p{margin:6px 0 0}
main{max-width:860px;margin:0 auto;padding:20px}
.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.scene{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.scene b{display:inline-block;background:#E8865A;color:#fff;border-radius:50%;width:28px;height:28px;text-align:center;line-height:28px;margin-right:6px}
.who{background:#FFF4CC;border-radius:14px;padding:16px;margin-top:18px}
footer{text-align:center;color:#888;font-size:14px;padding:20px}
@media (max-width:600px){.scenes{grid-template-columns:1fr}.top h1{font-size:30px}}
</style>
</head>
<body>
<header class="top"><h1>코코</h1><p>2017년 · 픽사 애니메이션 · 전체관람가</p></header>
<main>
<h2>한 줄 줄거리</h2>
<p>음악을 사랑하는 소년 미겔이 죽은 이들의 세상에 들어가, 가족이 숨겨 온 이야기를 찾아 나선다.</p>
<h2>내가 좋아하는 장면</h2>
<div class="scenes">
<div class="scene"><b>1</b>금잔화 다리를 처음 건너는 장면</div>
<div class="scene"><b>2</b>광장에서 기타를 치며 노래하는 장면</div>
<div class="scene"><b>3</b>할머니에게 노래를 불러 주는 마지막 장면</div>
</div>
<div class="who"><b>이런 사람에게 추천해요</b><br>가족과 함께 따뜻한 영화를 보고 싶은 사람, 음악 영화를 좋아하는 사람</div>
</main>
<footer>이 페이지는 AI와 함께 만들었습니다 · 영화 정보는 공식 자료로 확인했습니다</footer>
</body>
</html>
