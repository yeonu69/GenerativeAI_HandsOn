<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팝콘 받기 · 별빛극장</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hd"><a class="logo" href="index.html">★ 별빛극장</a><nav class="nav"><a href="index.html">홈</a><a href="quiz.html">퀴즈</a><a href="popcorn.html" class="on" aria-current="page">팝콘 게임</a><a href="diary.html">관람 기록장</a><a href="fee.html">관람료</a><a href="about.html">안내</a></nav></header><div class="wrap"><div class="bar2"><span>★ 팝콘 받기</span><span id="hud">점수 0 · ♥♥♥</span></div>
<div id="stage"><canvas id="cv" width="900" height="500"></canvas><div id="msg"><div>← → 방향키(휴대폰은 화면 왼쪽·오른쪽 누르기)로 바구니를 움직여 팝콘을 받으세요</div><button id="go">시작</button></div></div></div>
<script>
// ===== 난이도를 정하는 숫자(직접 바꿔 보세요) =====
const START_SPEED = 2.2;      // 팝콘이 처음 떨어지는 속도(1번 그릴 때 내려가는 칸 수)
const SPAWN_EVERY = 900;      // 팝콘이 새로 나오는 간격(밀리초, 작을수록 자주)
const SPEED_UP_EVERY = 10;    // 몇 점마다 빨라질지
// ================================================
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let basket, pops, score, lives, speed, lastSpawn, keys = {}, running = false, best = 0;
try { best = +localStorage.getItem("best") || 0; } catch (e) {}
function reset() { basket = {x: 400, w: 120}; pops = []; score = 0; lives = 3; speed = START_SPEED; lastSpawn = 0; }
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);
cv.addEventListener("pointerdown", e => { const r = cv.getBoundingClientRect(); keys.touch = (e.clientX - r.left) < r.width / 2 ? -1 : 1; });
cv.addEventListener("pointerup", () => keys.touch = 0);
function loop(t) {
  if (!running) return;
  // ① 입력 읽기
  const dir = (keys.ArrowLeft ? -1 : 0) + (keys.ArrowRight ? 1 : 0) + (keys.touch || 0);
  basket.x = Math.max(0, Math.min(cv.width - basket.w, basket.x + dir * 9));
  // ② 움직이기
  if (t - lastSpawn > SPAWN_EVERY) { pops.push({x: 20 + Math.random() * (cv.width - 40), y: -20}); lastSpawn = t; }
  pops.forEach(p => p.y += speed);
  // ③ 부딪힘 확인
  pops = pops.filter(p => {
    if (p.y > cv.height - 70 && p.y < cv.height - 30 && p.x > basket.x && p.x < basket.x + basket.w) { score++; if (score % SPEED_UP_EVERY === 0) speed += 0.6; return false; }
    if (p.y > cv.height) { lives--; return false; }
    return true;
  });
  // ④ 다시 그리기
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = "#FFF6D8"; pops.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, Math.PI * 2); ctx.fill(); });
  for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? "#fff" : "#E53935"; ctx.fillRect(basket.x + i * basket.w / 6, cv.height - 60, basket.w / 6, 50); }
  document.getElementById("hud").textContent = "점수 " + score + " · " + "♥".repeat(Math.max(lives, 0)) + "♡".repeat(3 - Math.max(lives, 0)) + " · 최고 " + best;
  if (lives <= 0) return end();
  requestAnimationFrame(loop);
}
function end() {
  running = false;
  if (score > best) { best = score; try { localStorage.setItem("best", best); } catch (e) {} }
  const m = document.getElementById("msg"); m.hidden = false;
  m.innerHTML = '<div>게임 끝! 점수 ' + score + ' · 최고 ' + best + '</div><button id="go">다시 하기</button>';
  document.getElementById("go").onclick = start;
}
function start() { reset(); running = true; document.getElementById("msg").hidden = true; requestAnimationFrame(loop); }
document.getElementById("go").onclick = start;
</script>
