<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관람료 계산기 · 별빛극장</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hd"><a class="logo" href="index.html">★ 별빛극장</a><nav class="nav"><a href="index.html">홈</a><a href="quiz.html">퀴즈</a><a href="popcorn.html">팝콘 게임</a><a href="diary.html">관람 기록장</a><a href="fee.html" class="on" aria-current="page">관람료</a><a href="about.html">안내</a></nav></header><main class="wrap fee"><h2>관람료 계산기</h2>
<p class="sm">만 19세 이하 6,000원 · 만 65세 이상 5,000원 · 그 밖 8,000원 · 인원 1~10명</p>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><label>나이 <input id="age" inputmode="numeric" style="width:100px"></label><label>인원 <input id="cnt" value="1" inputmode="numeric" style="width:80px"></label><button id="calc">계산</button></div>
<div class="res" id="out" aria-live="polite">나이와 인원을 넣고 [계산]을 누르세요.</div>
<h2>테스트 결과</h2><div id="sum" style="font-weight:800"></div><table class="tests" id="tests"></table></main><script>
// 요구 사항: 만 19세 이하 6,000원, 만 65세 이상 5,000원, 나머지 8,000원, 인원 1~10명
function fee(ageText, countText) {
  const age = Number(ageText), count = Number(countText);
  if (ageText === "" || !Number.isInteger(age) || age < 0 || age > 120) return {error: "나이를 0~120 사이의 숫자로 넣어 주세요"};
  if (countText === "" || !Number.isInteger(count) || count < 1 || count > 10) return {error: "인원은 1~10명"};
  const unit = age <= 19 ? 6000 : age >= 65 ? 5000 : 8000;   // 경계: 19 '이하', 65 '이상'
  return {unit: unit, total: unit * count};
}
// 테스트 표: 기대 결과는 코드가 아니라 요구 사항에서 정했다
const TESTS = [
  ["정상", "30", "2", 16000], ["정상", "15", "1", 6000], ["정상", "70", "3", 15000],
  ["경계", "19", "1", 6000], ["경계", "20", "1", 8000], ["경계", "64", "1", 8000], ["경계", "65", "1", 5000], ["경계", "30", "10", 80000],
  ["예외", "", "1", "나이를 0~120 사이의 숫자로 넣어 주세요"], ["예외", "열살", "1", "나이를 0~120 사이의 숫자로 넣어 주세요"], ["예외", "-3", "1", "나이를 0~120 사이의 숫자로 넣어 주세요"],
  ["예외", "30", "0", "인원은 1~10명"], ["예외", "30", "11", "인원은 1~10명"]
];
function runTests() {
  let pass = 0;
  const rows = TESTS.map(([kind, a, c, expect]) => {
    const r = fee(a, c), got = r.error || r.total, ok = got === expect; if (ok) pass++;
    return "<tr><td>" + kind + "</td><td>" + (a || "(빈칸)") + "세 · " + c + "명</td><td>" + expect + "</td><td>" + got + '</td><td class="' + (ok ? "pass" : "fail") + '">' + (ok ? "통과" : "실패") + "</td></tr>";
  });
  document.getElementById("tests").innerHTML = "<tr><th>종류</th><th>입력</th><th>기대</th><th>실제</th><th>판정</th></tr>" + rows.join("");
  document.getElementById("sum").textContent = (pass === TESTS.length ? "✔ " : "✖ ") + "테스트 " + TESTS.length + "개 중 " + pass + "개 통과";
}
document.getElementById("calc").onclick = () => {
  const r = fee(document.getElementById("age").value.trim(), document.getElementById("cnt").value.trim());
  document.getElementById("out").innerHTML = r.error ? '<span class="fail">' + r.error + "</span>" : r.unit.toLocaleString() + "원 × " + document.getElementById("cnt").value + "명 = <b>" + r.total.toLocaleString() + "원</b>";
};
runTests();
</script>

</html>
