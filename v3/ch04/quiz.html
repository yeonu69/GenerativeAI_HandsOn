<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영화 장면 퀴즈 · 별빛극장</title>
<style>
[hidden]{display:none!important}body{margin:0;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1d2233;background:#fff;font-size:17px;line-height:1.6}
.hd{background:#1E2A5A;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:12px 20px}
.logo{font-weight:900;font-size:24px;color:#FFD84D;text-decoration:none}
.nav a{color:#fff;margin-left:16px;text-decoration:none;font-size:16px;padding-bottom:3px}
.nav a.on{color:#FFD84D;border-bottom:3px solid #FFD84D}
.nav a:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #2B8AD6;outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:20px}
h2{font-size:22px;color:#1E2A5A;border-left:6px solid #FFC83D;padding-left:10px;margin:24px 0 12px}
button,.btn{font:inherit;background:#FFC83D;border:0;border-radius:10px;padding:10px 18px;font-weight:800;cursor:pointer;min-height:44px;color:#1d2233}
button.ghost{background:#fff;border:2px solid #1E2A5A}
input,select,textarea{font:inherit;border:2px solid #D7DBEA;border-radius:8px;padding:8px 10px;min-height:44px;box-sizing:border-box}
.ft{background:#EEF0F6;color:#555;padding:12px 20px;font-size:14px;margin-top:30px}
.ft a{color:#1E2A5A}
@media (max-width:600px){.nav a{margin-left:10px;font-size:15px}.wrap{padding:14px}}
.qz{max-width:760px;margin:0 auto;padding:20px}.qh{display:flex;justify-content:space-between;color:#666;font-size:15px}
.prg{height:10px;background:#EEE;border-radius:5px;margin:8px 0 18px}.prg i{display:block;height:10px;width:0;background:#FFC83D;border-radius:5px;transition:width .3s}
.sc{background:#F4F6FB;border-radius:12px;padding:16px 18px}.op{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.op button{background:#fff;border:2px solid #D7DBEA;text-align:left;font-weight:500}.op button.ok{border-color:#2E9E62;background:#E6F5EC;font-weight:800}.op button.ng{border-color:#D64545;background:#FDECEC}
.ex{margin-top:14px;font-weight:700;min-height:28px}.center{text-align:center;padding:40px 10px}.big{font-size:56px;font-weight:900;color:#1E2A5A}
@media (max-width:600px){.op{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="hd"><a class="logo" href="index.html">★ 별빛극장</a><nav class="nav"><a href="index.html">홈</a><a href="quiz.html" class="on" aria-current="page">퀴즈</a><a href="popcorn.html">팝콘 게임</a></nav></header><main class="qz" id="app"></main>
<script>
// 문제: 실제 대사를 옮기지 않고, 장면을 내 말로 설명한 문제
const QUESTIONS = [
  {scene: "죽은 이들의 세상에 들어간 소년이, 기타 하나와 가족의 사진을 단서로 고조할아버지의 진짜 이야기를 찾아 나선다.", options: ["코코", "리틀 포레스트", "인사이드 아웃 2", "업"], answer: 0, note: "멕시코 \'죽은 자의 날\'을 배경으로 한 애니메이션입니다."},
  {scene: "도시 생활에 지친 주인공이 시골집으로 돌아와 사계절 동안 직접 키운 재료로 밥을 지어 먹는다.", options: ["코코", "리틀 포레스트", "업", "인사이드 아웃 2"], answer: 1, note: "계절마다 달라지는 밥상이 이야기를 이끕니다."},
  {scene: "열세 살이 된 소녀의 머릿속에 \'불안\'을 비롯한 새로운 감정들이 찾아와 본부를 뒤흔든다.", options: ["업", "코코", "인사이드 아웃 2", "리틀 포레스트"], answer: 2, note: "감정들이 캐릭터가 되어 등장합니다."},
  {scene: "할아버지가 수천 개의 풍선을 매단 집을 타고 아내와 약속했던 폭포를 향해 하늘로 떠오른다.", options: ["업", "코코", "리틀 포레스트", "인사이드 아웃 2"], answer: 0, note: "첫 10분의 회상 장면이 유명합니다."},
  {scene: "가족이 음악을 금지한 집에서, 소년은 몰래 다락방에 자신만의 기타와 영상 자료를 숨겨 둔다.", options: ["인사이드 아웃 2", "업", "리틀 포레스트", "코코"], answer: 3, note: "음악을 둘러싼 가족의 비밀이 이야기의 출발점입니다."}
];
// 상태(변수): 지금 문제 번호, 점수, 틀린 문제, 이번 문제에서 답했는지
let idx = 0, score = 0, wrong = [], answered = false;
const app = document.getElementById("app");

function render() {                       // 데이터에 맞춰 화면 전체를 다시 그린다
  if (idx === -1) {                       // 시작 화면
    app.innerHTML = '<div class="center"><div class="big" style="font-size:30px">이 장면, 어떤 영화일까?</div><p>장면 설명을 읽고 영화를 맞혀 보세요 · ' + QUESTIONS.length + '문제</p><button id="start">시작하기</button></div>';
    document.getElementById("start").onclick = () => { idx = 0; render(); };
    return;
  }
  if (idx >= QUESTIONS.length) {          // 결과 화면
    app.innerHTML = '<div class="center"><div>결과</div><div class="big">' + score + ' / ' + QUESTIONS.length + '</div><p>' +
      (wrong.length ? '틀린 문제: ' + wrong.join(', ') + '번' : '모두 맞혔어요!') + '</p><button id="again">다시 하기</button> <a class="btn" href="index.html" style="background:#fff;border:2px solid #1E2A5A;text-decoration:none">홈으로</a></div>';
    document.getElementById("again").onclick = () => { idx = 0; score = 0; wrong = []; answered = false; render(); };
    return;
  }
  const q = QUESTIONS[idx];
  app.innerHTML = '<div class="qh"><span>문제 ' + (idx + 1) + ' / ' + QUESTIONS.length + '</span><span>점수 ' + score + '</span></div>' +
    '<div class="prg"><i style="width:' + (idx / QUESTIONS.length * 100) + '%"></i></div><div class="sc">' + q.scene + ' 어떤 영화일까요?</div>' +
    '<div class="op">' + q.options.map((o, i) => '<button data-i="' + i + '">' + (i + 1) + ') ' + o + '</button>').join('') + '</div>' +
    '<div class="ex" id="ex" aria-live="polite"></div><button id="next" disabled>다음 문제 ▶</button>';
  app.querySelectorAll(".op button").forEach(b => b.onclick = () => choose(+b.dataset.i));
  document.getElementById("next").onclick = () => { if (!answered) return; idx++; answered = false; render(); };
}

function choose(i) {                     // 사건: 보기를 눌렀다
  if (answered) return;                  // 규칙: 한 문제에서 답은 한 번만
  answered = true;
  const q = QUESTIONS[idx], btns = app.querySelectorAll(".op button");
  btns.forEach(b => b.disabled = true);  // 다른 보기 잠그기
  btns[q.answer].classList.add("ok");
  const ex = document.getElementById("ex");
  if (i === q.answer) { score++; ex.style.color = "#2E7D52"; ex.textContent = "정답! " + q.note; }
  else { btns[i].classList.add("ng"); wrong.push(idx + 1); ex.style.color = "#C0392B"; ex.textContent = "아쉬워요! 정답은 「" + q.options[q.answer] + "」입니다. " + q.note; }
  document.getElementById("next").disabled = false;
  document.querySelector(".qh span:last-child").textContent = "점수 " + score;
}
idx = -1; render();
</script>
<footer class="ft">이 사이트는 수업 「영화관으로 간 생성형 AI 실습」에서 AI와 함께 만든 가상의 동네 영화관입니다 · 주소·전화번호는 가상 · 포스터 그림: CSS로 그린 예시(실습에서는 이미지 생성 AI로 바꿔 넣기)</footer>
</body>
</html>
